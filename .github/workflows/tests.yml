name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install CPU PyTorch for runtime checkpoint tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Validate package and active runtime imports
        run: |
          python -m pip install -e . --no-deps --no-build-isolation
          python -c "import src.pose2d_estimator, src.person_tracking, src.vitpose_plus_runtime"
          python -c "import pathlib,yaml; from src.config_validation import validate_model_config; validate_model_config(yaml.safe_load(pathlib.Path('config/model_config.yaml').read_text(encoding='utf-8')))"
          python -c "import json,pathlib; from src.artifact_contracts import validate_main_3d_artifact; validate_main_3d_artifact(json.loads(pathlib.Path('tests/fixtures/contracts/current_main_3d.json').read_text(encoding='utf-8')))"
          tk3d-check --help
          tk3d-multiview --help
          tk3d-poomsae --help
          tk3d-check --output-root outputs/ci-reproducibility-check
      - name: Ruff
        run: |
          python -m ruff --version
          python -m ruff check src scripts tests --output-format github
      - name: Run tests
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp pytest-temp --junitxml=outputs/ci-pytest.xml
          $testExitCode = $LASTEXITCODE
          if (Test-Path 'outputs/ci-pytest.xml') {
            [xml]$testResults = Get-Content 'outputs/ci-pytest.xml' -Raw -Encoding utf8
            foreach ($testCase in $testResults.SelectNodes('//testcase[failure or error]')) {
              $detail = $testCase.GetAttribute('classname') + '.' + $testCase.GetAttribute('name') + ': ' + $testCase.InnerText
              $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=pytest failure::$detail"
            }
          }
          exit $testExitCode
      - name: Save test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: outputs/ci-pytest.xml
          if-no-files-found: ignore
      - name: Validate installed dependency consistency
        run: python -m pip check
      - name: Reject whitespace errors
        run: git diff --check
