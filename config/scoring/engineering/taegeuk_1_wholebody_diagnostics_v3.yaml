# Rules whose threshold carries a recorded referee signature. These are the only
# rules allowed to carry a deduction. The list must match the thresholds that
# actually carry a judge_source block; a mismatch either way is rejected.
# Empty means no referee has signed anything yet, so nothing here can change a score.
