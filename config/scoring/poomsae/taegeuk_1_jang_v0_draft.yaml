blocked_reasons:
  - Kick-punch compound movement tolerances need a second current official table-level cross-check before activation; their current metrics are diagnostic-only.
  - Technique-specific numeric tolerances are engineering hypotheses only and are not approved judging tolerances.
  - The current WT rules refer to an attached Poomsae Competition Scoring Guideline that was not found in the public current document list.
  - The recovered 2014 official scoring guideline is historical and cannot establish current numeric judging tolerances by itself.
