scoring:
  total_score: 10.0
  accuracy:
    initial_score: 4.0
    deductions:
      minor:
        rule_id: WT-2024-09-30-A16-1.2.2
        amount: 0.1
        scope: individual_movement
        definition: Small mistake in an individual movement as defined by the attached scoring guidelines.
        source_refs:
          - wt_poomsae_rules_2024-09-30#Article16-1.2.2
      major:
        rule_id: WT-2024-09-30-A16-1.2.3
        amount: 0.3
        scope: individual_movement
        definition: Wrong action or major individual-movement mistake as defined by the attached scoring guidelines.
        source_refs:
          - wt_poomsae_rules_2024-09-30#Article16-1.2.3
        categorical_examples:
          - id: MAJ-01
            text: Eolgul Makki is performed instead of Arae Makki
            measurable: pose_and_spec
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-02
            text: Dwit-gubi is performed instead of Juchum-Seogi
            measurable: pose_and_spec
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-03
            text: Kihap is not made or made at the wrong moment
            measurable: audio_required
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-04
            text: Temporary stop during movements for three seconds or longer
            measurable: pose_only
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-05
            text: Eyesight does not follow the side to which actions are made
            measurable: pose_and_spec
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-06
            text: The raised foot touches the ground in performing Hakdari-Seogi
            measurable: pose_only
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-07
            text: Jittzikgi movement without enough power and sound
            measurable: audio_required
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
          - id: MAJ-08
            text: The contestant makes loud breathing noises
            measurable: audio_required
            source_ref: wt_poomsae_rules_2024-09-30#Article16-Explanation2
      restart:
        rule_id: WT-2024-09-30-A16-EXPLANATION-3
        amount: 0.6
        scope: performance
        definition: The contestant restarts the Poomsae regardless of the number of movements performed.
        source_refs:
          - wt_poomsae_rules_2024-09-30#Article16-Explanation3
  presentation_reserved_score: 6.0
  final_score_deductions:
    time_violation:
      rule_id: WT-2024-09-30-A16-3.1
      amount: 0.3
      applies_to: final_score
      frequency: per_performance
      scope: performance
      definition: The contestant finishes the Poomsae under or over the designated time limit.
      source_refs:
        - wt_poomsae_rules_2024-09-30#Article16-3.1
    boundary_crossing:
      rule_id: WT-2024-09-30-A16-3.2
      amount: 0.3
      applies_to: final_score
      frequency: per_performance
      source_ambiguity: >-
        No reviewed source (WT 2024, BT, USAT, AAU) uses "each time" for individual
        recognized-Poomsae boundary crossing, unlike accuracy mistakes and team/demo
        rules which do. Secondary analysis frames it as a referee-managed procedural
        deduction (not a judge-entered technical fault), applied once to the final
        score; if two forms are performed in a round, it applies once per form. No
        explicit WT scoring-guideline/ESS quote was found; referee confirmation advised.
      scope: performance
      definition: The contestant crosses the boundary line of the competition area.
      source_refs:
        - wt_poomsae_rules_2024-09-30#Article16-3.2

  presentation:
    total_score: 6.0
    scoring_mode: holistic
    scoring_note: >-
      Presentation is scored for the overall performance, not by deducting for
      each individual mistake (WT Article 16, Explanation 4).
    components:
      speed_and_power:
        score: 2.0
        source_refs:
