pose2d:
  model_name: ViTPose-Huge-WholeBody
  backend: tk3d_vitpose_plus
  config_path: config/mmpose_configs/wholebody_2d_keypoint/vitpose/coco-wholebody/td-hm_ViTPose-huge_8xb64-210e_coco-wholebody-256x192.py
  checkpoint_path: weights/vitpose_huge_wholebody_256x192.pth
  device: cuda:0
  input_size: [256, 192]
  keypoint_count: 133
  score_threshold: 0.30
  flip_test: true
  temporal_filter_enabled: true
  temporal_stabilize_left_right: true
  offline_stabilization:
    enabled: true
    window_size: 9
    polynomial_order: 2
    min_outlier_distance_px: 6.0

person_detector:
  enabled: true
  backend: rfdetr
  model_variant: small
  threshold: 0.25
  target_confidence_threshold: 0.65
  person_class_id: 1
  bbox_padding: 0.18
  bbox_stationary_alpha: 0.35
  bbox_motion_scale_ratio: 0.12
  track_activation_threshold: 0.25
  minimum_matching_threshold: 0.80
  lost_track_buffer: 30
  reacquire_after_frames: 12
  optimize_for_inference: false

pose3d_single_view:
  model_name: RTMW3D-x
  backend: mmpose
  config_path: models/rtmw3d/rtmw3d-x.py
  checkpoint_path: weights/rtmw3d-x.pth
  device: cuda:0
  keypoint_count: 133
  enabled: false

triangulation:
  min_views: 2
  min_keypoint_score: 0.30
  min_triangulation_score: 0.20
  max_reprojection_error_px: 25.0
  max_hypotheses: 16

global_optimization:
  enabled: true
  min_observation_score: 0.30
  max_gap_frames: 12
  minimum_bone_samples: 12
  outer_iterations: 3
  max_solver_evaluations: 35
  reprojection_scale_px: 8.0
  bone_scale_m: 0.025
  acceleration_scale_mps2: 25.0
  jerk_scale_mps3: 500.0
  angle_scale_deg: 10.0
  anchor_scale_m: 0.15
  camera_weight_floor: 0.20
  camera_error_scale_px: 12.0
  camera_weight_update_alpha: 0.50
  temporal_speed_reference_mps: 4.0
  temporal_weight_floor: 0.15
  max_median_reprojection_degradation_ratio: 1.05
  max_p95_reprojection_degradation_ratio: 1.10
  max_median_reprojection_increase_px: 1.0
  max_p95_reprojection_increase_px: 2.0
  max_p95_acceleration_degradation_ratio: 1.10
  max_p95_acceleration_increase_mps2: 5.0
  max_p95_correction_m: 0.30
  weights:
    reprojection: 2.0
    bone: 1.0
    acceleration: 0.06
    jerk: 0.01
    joint_limits: 0.50
    anchor: 0.03

smoothing:
  method: robust_savgol
  window_size: 11
  polynomial_order: 2
  min_outlier_distance_m: 0.04

reliability:
  max_bone_relative_deviation: 0.25
  max_bone_absolute_deviation_m: 0.08
  min_temporal_residual_m: 0.08
  max_temporal_acceleration_mps2: 70.0
  minimum_bone_samples: 5
  min_output_valid_body_ratio: 0.90
